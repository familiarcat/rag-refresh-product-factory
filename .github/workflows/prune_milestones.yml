name: Prune local milestone artifacts

on:
  schedule:
    - cron: "0 9 * * *"  # daily
  workflow_dispatch: {}

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prune
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MILESTONE_RETENTION_DAYS: "14"
        run: |
          node scripts/milestone/prune_local.mjs

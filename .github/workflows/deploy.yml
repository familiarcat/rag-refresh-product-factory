name: Deploy to EC2 (SSM)

# ============================================================================
# DEPLOYMENT STRATEGY (Development Mode)
# ============================================================================
# Auto-deploy is DISABLED for cost/speed efficiency during development.
# Milestones push to git + Supabase but don't trigger AWS deployment.
#
# To deploy:
#   Local:  ./scripts/deploy-app.sh
#   GitHub: Run workflow manually via Actions tab or:
#           gh workflow run deploy.yml
#
# To re-enable auto-deploy for production, uncomment the 'push' trigger below.
# ============================================================================

on:
  # Auto-deploy disabled during development (uncomment for production)
  # push:
  #   branches: [ "main" ]
  #   paths:
  #     - 'app/**'
  #     - 'components/**'
  #     - 'lib/**'
  #     - 'public/**'
  #     - 'package.json'
  #     - 'package-lock.json'
  #     - 'Dockerfile'
  #     - 'next.config.js'
  #     - 'tsconfig.json'

  # Manual trigger only (via GitHub Actions UI or CLI)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

env:
  AWS_REGION: us-east-2
  ECR_REPO: rag-refresh-product-factory
  EC2_INSTANCE_ID: i-006cd2a8477f36489
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Configure AWS credentials (via Worf security system)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        # Secrets managed by Worf: scripts/worf/worf.sh ci

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo Deploying ${{ env.IMAGE_TAG }} at $(date)",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest",
              "docker stop rag-app 2>/dev/null || true",
              "docker rm rag-app 2>/dev/null || true",
              "docker run -d --name rag-app -p 3000:3000 --restart always ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest",
              "docker ps",
              "echo Deployment complete!"
            ]' \
            --query 'Command.CommandId' --output text)
          
          echo "SSM Command ID: $COMMAND_ID"
          
          # Wait for command to complete
          echo "Waiting for deployment to complete..."
          sleep 30
          
          # Check result
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query 'Status' --output text)
          
          echo "Deployment status: $STATUS"
          
          if [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment successful!"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query 'StandardOutputContent' --output text
          else
            echo "❌ Deployment failed!"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi

      - name: Notify deployment
        if: success()
        run: |
          echo "🚀 Deployed to https://rag.pbradygeorgen.com"
          echo "   Image: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}"
          echo "   Time: ${{ env.TIMESTAMP }}"

services:
  app:
    image: "${APP_IMAGE:?set by deploy}"
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - N8N_PROJECT_WEBHOOK_URL=${N8N_PROJECT_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

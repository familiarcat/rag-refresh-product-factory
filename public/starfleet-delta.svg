<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="deltaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8a8ff"/>
      <stop offset="30%" style="stop-color:#7c5cff"/>
      <stop offset="70%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00ff9f"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffb800"/>
      <stop offset="100%" style="stop-color:#ff9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer oval/ellipse background (communicator badge shape) -->
  <ellipse cx="50" cy="52" rx="42" ry="45" fill="#1a1a2e" stroke="#7c5cff" stroke-width="2"/>
  
  <!-- Delta arrowhead -->
  <path 
    d="M50 8
       Q58 22 75 85
       Q50 72 50 72
       Q50 72 25 85
       Q42 22 50 8
       Z"
    fill="url(#deltaGradient)"
    filter="url(#glow)"
  />
  
  <!-- Inner delta highlight -->
  <path 
    d="M50 18
       Q55 28 65 70
       L50 62
       L35 70
       Q45 28 50 18
       Z"
    fill="rgba(255,255,255,0.15)"
  />
  
  <!-- Starfleet star -->
  <g transform="translate(50, 48)" filter="url(#glow)">
    <path 
      d="M0 -12 L2 -3 L12 0 L2 3 L0 12 L-2 3 L-12 0 L-2 -3 Z"
      fill="#ffffff"
    />
    <circle cx="0" cy="0" r="2.5" fill="#7c5cff"/>
  </g>
</svg>
